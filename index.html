<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Wheel Picker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>🎯 RANDOM WHEEL PICKER</h1>

    <div class="setup-card">

        <label>
            Số lượng đối tượng
        </label>

        <input
            id="countInput"
            type="number"
            min="2"
            max="20"
            placeholder="2 - 20"
        >

        <label class="checkbox">

            <input
                id="removeWinner"
                type="checkbox"
            >

            Loại đối tượng sau khi quay trúng

        </label>

        <button id="createBtn">

            TẠO DANH SÁCH

        </button>

        <p id="error"></p>

    </div>

    <div
        id="namesContainer"
        class="hidden">
    </div>

    <div
        id="wheelSection"
        class="hidden">

        <div id="wheelWrapper">

            <div id="pointer"></div>

            <svg
                id="wheel"
                width="500"
                height="500"
                viewBox="-250 -250 500 500">
            </svg>

        </div>

        <div class="button-group">

            <button id="buildWheelBtn">

                🎡 TẠO VÒNG QUAY

            </button>

            <button
                id="spinBtn"
                disabled>

                🎯 QUAY

            </button>

            <button id="resetBtn">

                🔄 ĐẶT LẠI

            </button>

        </div>

    </div>

    <div id="result"></div>

</div>

<script src="script.js"></script>

</body>
</html>
